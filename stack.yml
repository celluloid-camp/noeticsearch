# Self-hosting stack for NoeticSearch
# Includes: Traefik reverse proxy, PostgreSQL, Redis, Adminer, and the NoeticSearch app.
#
# Usage:
#   cp .env.sample .env
#   docker compose -f stack.yml --env-file .env up -d
#
# Or inline:
#   HOST=noeticsearch.huma-num.fr ACME_EMAIL=you@example.com docker compose -f stack.yml up -d
#
# Default hostnames (when HOST is not set):
#   - https://noeticsearch.localhost/         -> app
#   - https://noeticsearch.localhost/adminer  -> database UI
#
# Traefik listens on 80 (HTTP → HTTPS redirect) and 443 (TLS via Let's Encrypt).
# Point DNS for HOST at this machine and set ACME_EMAIL before first start.
#
# Optional one-shot DB import: set BACKUP_DATABASE_URL (e.g. Neon) to dump that
# database and restore into stack postgres before the app starts. Unset it after
# the first successful import so later restarts do not overwrite local data.
#
# On first start the app container runs migrations, workflow setup, and seeding.

configs:
  postgres_db_sh:
    content: |
      #!/bin/sh
      set -eu

      if [ -z "$${BACKUP_DATABASE_URL:-}" ]; then
        echo "BACKUP_DATABASE_URL not set, skipping backup/restore."
        exit 0
      fi

      case "$$BACKUP_DATABASE_URL" in
        *-pooler*)
          echo "ERROR: BACKUP_DATABASE_URL uses a Neon pooled endpoint (-pooler)."
          echo "pg_dump requires a direct connection. In Neon Connect, disable Connection pooling."
          exit 1
          ;;
      esac

      # channel_binding=require can fail on some host networks; sslmode=require is enough.
      BACKUP_DATABASE_URL=$$(printf %s "$$BACKUP_DATABASE_URL" | sed -E 's/[?&]channel_binding=[^&]*//g; s/\?&/?/g; s/\?$$//')

      DUMP=/tmp/backup.dump

      echo "Waiting for PostgreSQL at $${PGHOST}:$${PGPORT}..."
      until pg_isready -h "$$PGHOST" -p "$$PGPORT" -U "$$PGUSER" -d "$$PGDATABASE" >/dev/null 2>&1; do sleep 1; done

      echo "Waking / testing remote database..."
      attempt=1
      until psql "$$BACKUP_DATABASE_URL" -c "select 1" >/dev/null 2>&1; do
        if [ "$$attempt" -ge 10 ]; then
          echo "ERROR: cannot connect to BACKUP_DATABASE_URL after $$attempt attempts."
          echo "From this host, check: outbound TCP 5432, Neon IP allowlist, and that the compute is active."
          psql "$$BACKUP_DATABASE_URL" -c "select 1" || true
          exit 1
        fi
        echo "Remote DB not ready (attempt $$attempt/10), retrying..."
        attempt=$$((attempt + 1))
        sleep 3
      done

      echo "Backing up remote database..."
      pg_dump "$$BACKUP_DATABASE_URL" --no-owner --no-acl -Fc -f "$$DUMP"
      echo "Backup written: $$DUMP ($$(wc -c <"$$DUMP" | tr -d ' ') bytes)"

      echo "Restoring into \"$${PGDATABASE}\"..."
      psql -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS unaccent;"
      psql -v ON_ERROR_STOP=1 -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = current_database() AND pid <> pg_backend_pid();"
      pg_restore -v --no-owner --no-acl --clean --if-exists -d "$$PGDATABASE" "$$DUMP"

      echo "Backup and restore complete."

services:
  traefik:
    image: traefik:latest
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.priority=1"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--ping=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ${DATA_DIR:-./data}/letsencrypt:/letsencrypt
    networks:
      - noeticsearch

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noeticsearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noeticsearch}
      POSTGRES_DB: ${POSTGRES_DB:-noeticsearch}
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-noeticsearch} -d ${POSTGRES_DB:-noeticsearch}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - noeticsearch

  db-restore:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-noeticsearch}
      PGPASSWORD: ${POSTGRES_PASSWORD:-noeticsearch}
      PGDATABASE: ${POSTGRES_DB:-noeticsearch}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:-}
    configs:
      - source: postgres_db_sh
        target: /postgres-db.sh
    entrypoint: ["/bin/sh", "/postgres-db.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - noeticsearch

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - noeticsearch

  adminer:
    image: adminer:latest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Host(`${HOST:-noeticsearch.localhost}`) \u0026\u0026 PathPrefix(`/adminer`)"
      - "traefik.http.routers.adminer.entrypoints=websecure"
      - "traefik.http.routers.adminer.tls=true"
      - "traefik.http.routers.adminer.tls.certresolver=letsencrypt"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.adminer-stripprefix.stripprefix.prefixes=/adminer"
      - "traefik.http.routers.adminer.middlewares=adminer-stripprefix@docker"
    depends_on:
      postgres:
        condition: service_healthy
      db-restore:
        condition: service_completed_successfully
    networks:
      - noeticsearch

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/celluloid-camp/noeticsearch:latest
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-noeticsearch}:${POSTGRES_PASSWORD:-noeticsearch}@postgres:5432/${POSTGRES_DB:-noeticsearch}
      WORKFLOW_TARGET_WORLD: "@workflow/world-postgres"
      WORKFLOW_POSTGRES_URL: postgres://${POSTGRES_USER:-noeticsearch}:${POSTGRES_PASSWORD:-noeticsearch}@postgres:5432/${POSTGRES_DB:-noeticsearch}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-in-production}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@noeticsearch.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`${HOST:-noeticsearch.localhost}`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-restore:
        condition: service_completed_successfully
    networks:
      - noeticsearch

networks:
  noeticsearch:
    driver: bridge
