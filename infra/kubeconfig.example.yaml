# Example kubeconfig: SSH LocalForward only (no Squid proxy-url).
# Copy to kubeconfig.local.yaml and fill CA + token.
#
#   ssh -N noetic   # LocalForward 6443 (already in Host noetic)
#   export KUBECONFIG=$PWD/infra/kubeconfig.local.yaml
#   kubectl get nodes
#
apiVersion: v1
kind: Config
clusters:
  - name: noeticsearch-huma-num
    cluster:
      server: https://127.0.0.1:6443
      certificate-authority-data: REPLACE_CA_BASE64
contexts:
  - name: noeticsearch-huma-num
    context:
      cluster: noeticsearch-huma-num
      user: headlamp-admin
current-context: noeticsearch-huma-num
users:
  - name: headlamp-admin
    user:
      token: REPLACE_SA_TOKEN
