# Example Kubernetes Secret for NoeticSearch.
# Copy to secrets.yml and fill values (or regenerate from the Huma-Num .env).
# secrets.yml is gitignored — do not commit real credentials.
#
#   cp infra/secrets.example.yml infra/secrets.yml
#   kubectl apply -f infra/secrets.yml
#
apiVersion: v1
kind: Secret
metadata:
  name: noeticsearch
  namespace: noeticsearch
type: Opaque
stringData:
  HOST: "noeticsearch.huma-num.fr"
  ACME_EMAIL: "admin@example.com"
  POSTGRES_USER: "noeticsearch"
  POSTGRES_PASSWORD: "change-me"
  POSTGRES_DB: "noeticsearch"
  DATABASE_URL: "postgres://noeticsearch:change-me@postgres:5432/noeticsearch"
  WORKFLOW_POSTGRES_URL: "postgres://noeticsearch:change-me@postgres:5432/noeticsearch"
  REDIS_URL: "redis://redis:6379"
  BETTER_AUTH_SECRET: "generate-with-openssl-rand-base64-32"
  MISTRAL_API_KEY: ""
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "change-me"
  NEXT_TELEMETRY_DISABLED: "1"
  # Optional Neon / external backup URL
  # BACKUP_DATABASE_URL: ""
