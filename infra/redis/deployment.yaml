apiVersion: v1
kind: PersistentVolume
metadata:
  name: noeticsearch-redis-pv
  labels:
    app: redis
    app.kubernetes.io/name: noeticsearch-redis
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: noeticsearch-hostpath
  hostPath:
    path: /home/yvenaomar/k8s-data/noeticsearch/redis
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: noeticsearch
  labels:
    app: redis
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: noeticsearch-hostpath
  resources:
    requests:
      storage: 5Gi
  volumeName: noeticsearch-redis-pv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: noeticsearch
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: noeticsearch
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
